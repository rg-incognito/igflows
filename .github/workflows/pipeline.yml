name: Bike IG Reels Pipeline

on:
  schedule:
    # 6x per day — posted 30-60 min BEFORE each US peak (EST=UTC-5, PST=UTC-8)
    # Strategy: Reels need time for IG to test before the peak hits
    - cron: '0 13 * * *'   #  8:00 AM EST /  5:00 AM PST  ← before 9 AM morning peak
    - cron: '0 16 * * *'   # 11:00 AM EST /  8:00 AM PST  ← before noon peak
    - cron: '0 19 * * *'   #  2:00 PM EST / 11:00 AM PST  ← before 3 PM afternoon peak
    - cron: '0 22 * * *'   #  5:00 PM EST /  2:00 PM PST  ← before 6 PM after-work peak
    - cron: '0 1 * * *'    #  8:00 PM EST /  5:00 PM PST  ← prime evening US
    - cron: '0 3 * * *'    # 10:00 PM EST /  7:00 PM PST  ← late evening both coasts

  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run even if daily limit reached'
        required: false
        default: 'false'

jobs:
  post-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install ffmpeg + Node.js for yt-dlp EJS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg nodejs
          ffmpeg -version | head -1
          node --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements_ci.txt') }}

      - name: Install dependencies
        run: pip install -r requirements_ci.txt

      - name: Write credentials from secrets
        env:
          GDRIVE_TOKEN_JSON:    ${{ secrets.GDRIVE_TOKEN_JSON }}
          YT_CLIENT_JSON:       ${{ secrets.YT_CLIENT_JSON }}
          YT_TOKEN_JSON:        ${{ secrets.YT_TOKEN_JSON }}
        run: |
          mkdir -p music output/temp logs
          echo "$GDRIVE_TOKEN_JSON" > drive_token.json
          echo "$YT_CLIENT_JSON"    > yt_client_secret.json
          echo "$YT_TOKEN_JSON"     > yt_token.json
          # ig_session.json is written by the pipeline itself from IG_SESSION_JSON env var

      - name: Download state from Google Drive
        env:
          GDRIVE_FOLDER_ID: "1CivbmOzwqkCmyOZmmC7UC2p6EGDitjCB"
        run: python drive_manager.py download_state

      - name: Run pipeline
        env:
          GDRIVE_FOLDER_ID:       "1CivbmOzwqkCmyOZmmC7UC2p6EGDitjCB"
          FB_PAGE_TOKEN:          ${{ secrets.FB_PAGE_TOKEN }}
          IG_FB_PAGE_ID:          "1097766650082927"
          TELEGRAM_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:       ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_RUN_ID:          ${{ github.run_id }}
          FORCE_RUN:              ${{ github.event.inputs.force_run }}
        run: python pipeline_ci.py

      - name: Upload state back to Google Drive
        if: always()
        env:
          GDRIVE_FOLDER_ID: "1CivbmOzwqkCmyOZmmC7UC2p6EGDitjCB"
        run: python drive_manager.py upload_state

      - name: Refresh GDRIVE_TOKEN_JSON secret with latest token
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -f drive_token.json ] && [ -n "$GH_TOKEN" ]; then
            gh secret set GDRIVE_TOKEN_JSON < drive_token.json
            echo "GDRIVE_TOKEN_JSON secret updated with refreshed token"
          else
            echo "Skipping secret update (drive_token.json missing or GH_PAT not set)"
          fi

